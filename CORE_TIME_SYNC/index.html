<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Core Time Sync — ORPHE CORE</title>
<script src="../assets/js/site-analytics.js"></script>
</head>

<body>
    <h1>Core Time Sync</h1>
    <p>ORPHE COREのDateTimeを読み取り、PC時刻を基準に時刻補正を試すためのデバッグ用Exampleです。</p>
    <button onclick="activateNotify();">通知を有効化</button> COREから加速度センサの値を取得します<br>
    <p>結果:<br> <span id="acc"></span></p>
    <hr>
    <button onclick="getCoreTime();">時刻を取得する</button> COREモジュールからDateTimeを利用して時刻を取得します<br>
    <p>
        結果：<br><span id="timestamp"></span>
    </p>
    <hr>
    <button onclick="doAdjustCoreTime();">時刻補正実行</button> COREから時刻を取得して，データを読み出して完了するまでの時間の半分だけCOREの時刻を進めます<br>
    <p>結果:<br> <span id="result"></span></p>
    <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE-INSOLE.js@v0.2.1/dist/browser/orphe-core-insole.js"></script>
    <script>
        const { OrpheCoreInsole, coreProfile } = OrpheCoreInsoleJS;
        // ORPHE CORE Init（chooser の条件は名前が 'CR-' で始まるデバイス）
        var core = new OrpheCoreInsole({
            profile: coreProfile({ namePrefix: 'CR-' }),
            id: 0,
            events: {
                onError(error) { console.error(error); },
            },
        });
        // converted_acc は実 G 値 (±range G) を返す。
        // 表示用なので正規化値より読みやすいこちらを使用。
        // 購読はページ読み込み時に 1 回だけ登録する（ボタンを押すたびに重複登録しないため）。
        core.on('converted_acc', (acc) => {
            document.querySelector('#acc').innerText = `x:${acc.x}, y:${acc.y}, z:${acc.z}`;
        });
        async function getCoreTime() {
            // readDateTime() は { date, raw, round_trip_time } を返す（raw が DATE_TIME の生バイト）
            let ret = await core.readDateTime();
            let e = document.getElementById("timestamp");
            e.innerText = "YY MM DD HH MM SS ss: ";
            let str_timestamp = '';
            for (let i = 0; i < ret.raw.byteLength; i++) {
                e.innerHTML += String(ret.raw.getUint8(i)).toString(16).padStart(2, '0') + " ";
                str_timestamp += String(ret.raw.getUint8(i)).toString(16).padStart(2, '0');
            }
            str_timestamp += "00";
            e.innerHTML += "<br>";
        }
        function activateNotify() {
            core.begin("SENSOR_VALUES").catch(console.error);
        }
        async function doAdjustCoreTime() {

            let s = await core.syncTime({ samples: 3 });

            let e = document.getElementById("result");
            e.innerHTML = `Result: <br>
            取得した各round trip値[${s.round_trip_times}]<br>
            round trip合計値：${s.sum_round_trip_time}[ms]<br>
            round trip平均値：${s.average_round_trip_time}[ms]<br>
            round trip平均値/2：${s.average_round_trip_time / 2}[ms]<br>
            PC現在時刻：${s.standard_time}<br>
            CR設定時刻：${s.adjusted_time}`

        }
    </script>
</body>

</html>
