<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>orphe.js</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css">
</head>

<body>
    <h1>Number of STEPS</h1>
<button onclick="ble.begin('STEP_ANALYSIS');">connect</button>
    <br>
    <ul>
        <li id="steps_number"></li>
    </ul>


    
    <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE-INSOLE.js@v0.2.0/dist/browser/orphe-core-insole.js"></script>
    <script>
        const { OrpheCoreInsole, coreProfile } = OrpheCoreInsoleJS;

        var ble = new OrpheCoreInsole({
            profile: coreProfile({ namePrefix: 'CR-' }),
            id: 0,
            events: { onError(error) { console.error(error); } }
        });
        ble.on('steps_number', function (steps_number) {
            document.querySelector('#steps_number').innerHTML = steps_number.value;
        });
    
    </script>
</body>

</html>
