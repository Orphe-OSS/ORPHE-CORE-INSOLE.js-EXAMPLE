<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
</head>
<body>
    <button onclick="mystart();">connect</button>
    <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE-INSOLE.js@v0.2.1/dist/browser/orphe-core-insole.js"></script>
    <script>
        const { OrpheCoreInsole, coreProfile } = OrpheCoreInsoleJS;
        var core;
        window.onload = function () {
            core = new OrpheCoreInsole({
                profile: coreProfile({ namePrefix: 'CR-' }),
                id: 0,
                events: { onError(error) { console.error(error); } }
            });
            // 購読は 1 回だけ登録する（接続のたびに on() を呼ぶと多重登録になる）
            core.on('acc', function (acc) {
                console.log(acc);
            });
        }
        function mystart() {
            core.begin('SENSOR_VALUES');
        }
    </script>
</body>
</html>
